<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PyME Control Logística</title>
</head>
<body>
  <h1>Sistema de Control de Logística</h1>
  <p id="status">Cargando...</p>
  <script>
    fetch('http://localhost:4000/api/health')
      .then(res => res.json())
      .then(data => document.getElementById('status').innerText = data.message)
      .catch(() => document.getElementById('status').innerText = 'Backend no conectado aún');
  </script>
</body>
</html>
