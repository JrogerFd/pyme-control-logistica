
services:
  db:
    image: mysql:8.0
    container_name: pyme_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: pyme_logistica
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: ./backend
    container_name: pyme_backend
    restart: always
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: mysql://root:rootpassword@db:3306/pyme_logistica
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: pyme_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
